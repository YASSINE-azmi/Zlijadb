[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/YASSINE-azmi/Zlijadb"
rust-version = "1.85"
authors = ["Yassine Azmi"]

[workspace.dependencies]
# Storage
redb = "4.1.0"

# CRDT — اختر واحدة فقط (Phase 0)
automerge = "0.10.0"
# yrs = "0.27.3"

# Async — فقط لـ sync، لا تستخدمه في core/storage
tokio = { version = "1.53", features = ["rt", "macros", "sync", "time"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
ciborium = "0.2.2"

# Utilities
thiserror = "2.0"
clap = { version = "4.6", features = ["derive"] }

# Internal crates (path deps)
zlijadb-core = { path = "crates/zlijadb-core" }
zlijadb-storage = { path = "crates/zlijadb-storage" }
zlijadb-crdt = { path = "crates/zlijadb-crdt" }
zlijadb-sync = { path = "crates/zlijadb-sync" }